<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Jobs | LocalHire</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/escrow.css">
</head>
<body>

    <div id="navbar-container"></div>

    <div class="container" style="padding: 3rem 1.5rem;">
        
        <div class="flex items-center justify-between" style="margin-bottom: 2rem; border-bottom: 1px solid var(--border-light); padding-bottom: 1.5rem;">
            <div>
                <h2>My Dashboard</h2>
                <p class="text-muted">Manage jobs and saved workers.</p>
            </div>
            <a href="post-job.html" class="btn btn-primary" id="btn-post" style="display: none;">Post New Job</a>
        </div>

        <!-- Dashboard Tabs -->
        <div class="flex gap-4" style="margin-bottom: 2rem; border-bottom: 1px solid var(--border-light);" id="tab-container">
            <button id="tab-myjobs" class="btn" style="background: transparent; border-radius: 0; padding: 0.75rem 0; border-bottom: 2px solid var(--primary); color: var(--text-main);">My Jobs</button>
            <button id="tab-saved" class="btn text-muted" style="background: transparent; border-radius: 0; padding: 0.75rem 0; font-weight: 500;">Saved Workers</button>
            <button id="tab-apps" class="btn text-muted" style="display: none; background: transparent; border-radius: 0; padding: 0.75rem 0; font-weight: 500;">Applications</button>
        </div>

        <!-- Views -->
        <div id="view-myjobs" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Jobs populated via JS -->
        </div>

        <div id="view-saved" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" style="display: none;">
            <!-- Saved workers populated via JS -->
        </div>

        <div id="view-apps" style="display: none; padding: 1rem 0;">
            <!-- Applications populated via JS -->
            <div id="apps-container" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
            
            <div id="no-apps" style="display: none; text-align: center; padding: 4rem 2rem;" class="glass-card">
                <svg class="icon text-muted" style="width: 48px; height: 48px; margin: 0 auto 1rem auto;" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                <h3>No applications yet</h3>
                <p class="text-muted">Jobs you apply to will show up here.</p>
                <a href="jobs.html" class="btn btn-primary" style="margin-top: 1rem;">Browse Jobs</a>
            </div>
        </div>

        <!-- Customer Applications Modal -->
        <div id="customer-apps-modal" style="display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(8px); z-index: 1000; align-items: center; justify-content: center;">
            <div class="glass-card animate-fade-in flex flex-col" style="width: 100%; max-width: 600px; max-height: 80vh; padding: 2.5rem;">
                <div class="flex justify-between items-start" style="margin-bottom: 1.5rem; flex-shrink: 0;">
                    <h3 style="margin: 0; font-size: 1.5rem;">Quotes Received</h3>
                    <button type="button" class="btn" id="close-customer-apps" style="padding: 0; background: transparent; color: var(--text-muted);">&times;</button>
                </div>
                
                <p id="modal-job-title" style="font-weight: 500; margin-bottom: 1.5rem; flex-shrink: 0;"></p>

                <div id="modal-apps-list" style="overflow-y: auto; flex-grow: 1; padding-right: 0.5rem;" class="flex flex-col gap-4">
                    <!-- Populated via JS -->
                </div>
            </div>
        </div>
        
    </div>

    <script src="../js/data.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/escrow.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderNavbar('navbar-container', 'pages');

            const user = window.localHireApp.getCurrentUser();
            if (!user) {
                window.location.href = 'auth.html';
                return;
            }

            // UI Elements
            const btnPost = document.getElementById('btn-post');
            const tabMyJobs = document.getElementById('tab-myjobs');
            const tabSaved = document.getElementById('tab-saved');
            const tabApps = document.getElementById('tab-apps');
            const viewMyJobs = document.getElementById('view-myjobs');
            const viewSaved = document.getElementById('view-saved');
            const viewApps = document.getElementById('view-apps');

            // Role specific logic
            if (user.role === 'Customer') {
                btnPost.style.display = 'inline-flex';
                tabSaved.style.display = 'inline-block';
                tabApps.style.display = 'none';
            } else if (user.role === 'Worker') {
                btnPost.style.display = 'none';
                tabSaved.style.display = 'none';
                tabMyJobs.textContent = 'Active Contracts';
                tabApps.style.display = 'inline-block';
            }

            // Tab Switching Logic
            function setActiveTab(tabBtn, viewDiv) {
                // Reset tabs
                [tabMyJobs, tabSaved, tabApps].forEach(t => {
                    t.style.borderBottom = 'none';
                    t.style.color = 'var(--text-muted)';
                });
                // Set active tab
                tabBtn.style.borderBottom = '2px solid var(--primary)';
                tabBtn.style.color = 'var(--text-main)';

                // Hide all views
                [viewMyJobs, viewSaved, viewApps].forEach(v => v.style.display = 'none');
                
                // Show requested view
                if (viewDiv.id === 'view-apps' || viewDiv.innerHTML.includes('No jobs') || viewDiv.innerHTML.includes('No saved')) {
                    viewDiv.style.display = 'block'; // Keep centered format for empty states
                } else {
                    viewDiv.style.display = 'grid'; // Grid format for populated cards
                }
            }

            tabMyJobs.addEventListener('click', () => setActiveTab(tabMyJobs, viewMyJobs));
            if (tabSaved) tabSaved.addEventListener('click', () => setActiveTab(tabSaved, viewSaved));
            if (tabApps) tabApps.addEventListener('click', () => setActiveTab(tabApps, viewApps));

            // Load Jobs
            const allJobs = window.localHireApp.getJobs();
            // Just matching name for this mock, normally would match customerId or workerId
            const myJobs = allJobs.filter(j => j.customerName === user.name);

            if (myJobs.length === 0) {
                viewMyJobs.innerHTML = `
                    <div style="grid-column: 1 / -1; text-align: center; padding: 4rem 2rem;" class="glass-card">
                        <svg class="icon text-muted" style="width: 48px; height: 48px; margin: 0 auto 1rem auto;" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                        <h3>No jobs found</h3>
                        <p class="text-muted" style="margin-bottom: 1.5rem;">You don't have any active jobs or requests.</p>
                        ${user.role === 'Customer' ? `<a href="post-job.html" class="btn btn-primary">Post a Job</a>` : `<a href="jobs.html" class="btn btn-primary">Browse Jobs</a>`}
                    </div>
                    
                `;
                viewMyJobs.style.display = 'block';
            } else {
                myJobs.forEach(job => {
                    let cardHtml = createJobCard(job);
                    
                    if (user.role === 'Customer') {
                        // Append view quotes button for customers
                        const appCount = window.localHireApp.getApplicationsForJob(job.id).length;
                        
                        const wrapper = document.createElement('div');
                        wrapper.innerHTML = cardHtml;
                        const cardDiv = wrapper.firstElementChild;
                        
                        let actionHtml = '';
                        if (job.status === 'In Progress') {
                            actionHtml = `
                                <div style="margin-top: 1rem; border-top: 1px dashed var(--border-light); padding-top: 1rem; display: flex; flex-direction: column; gap: 0.5rem;">
                                    <span class="escrow-badge escrow-held" style="align-self: flex-start;">🔒 Payment Locked in Escrow</span>
                                    <button class="btn btn-primary release-escrow-btn" style="width: 100%; font-size: 0.85rem;" onclick="window.LocalHireEscrow.releasePayment('${job.id}')">
                                        Release Payment & Complete Job
                                    </button>
                                </div>
                            `;
                        } else {
                            actionHtml = `
                                <div style="margin-top: 1rem; border-top: 1px dashed var(--border-light); padding-top: 1rem;">
                                    <button class="btn btn-outline view-quotes-btn" style="width: 100%; border-color: var(--primary); color: var(--primary);" data-job-id="${job.id}" data-job-title="${job.title}">
                                        View Quotes (${appCount})
                                    </button>
                                </div>
                            `;
                        }
                        cardDiv.innerHTML += actionHtml;
                        viewMyJobs.appendChild(cardDiv);
                    } else {
                        viewMyJobs.innerHTML += cardHtml;
                    }
                });
            }

            // Load Saved Workers (if Customer)
            if (user.role === 'Customer') {
                const users = window.localHireApp.getUsers();
                const freshUser = users.find(u => u.id === user.id);
                
                if (!freshUser.favorites || freshUser.favorites.length === 0) {
                    viewSaved.innerHTML = `
                        <div style="grid-column: 1 / -1; text-align: center; padding: 4rem 2rem;" class="glass-card">
                            <svg class="icon text-muted" style="width: 48px; height: 48px; margin: 0 auto 1rem auto;" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                            <h3>No saved workers</h3>
                            <p class="text-muted" style="margin-bottom: 1.5rem;">Browse and save your favorite professionals for quick access later.</p>
                            <a href="search.html" class="btn btn-outline">Find Workers</a>
                        </div>
                    `;
                } else {
                    freshUser.favorites.forEach(workerId => {
                        const worker = window.localHireApp.getWorkerById(workerId);
                        if (worker) {
                            viewSaved.innerHTML += createWorkerCard(worker);
                        }
                    });
                }
            }

            // Customer Modal Logic
            if (user.role === 'Customer') {
                const modal = document.getElementById('customer-apps-modal');
                const closeBtn = document.getElementById('close-customer-apps');
                const modalTitle = document.getElementById('modal-job-title');
                const modalList = document.getElementById('modal-apps-list');

                // Bind View Quotes buttons using event delegation since they are added dynamically
                viewMyJobs.addEventListener('click', async (e) => {
                    const btn = e.target.closest('.view-quotes-btn');
                    if (btn) {
                        const jobId = btn.getAttribute('data-job-id');
                        const jobTitle = btn.getAttribute('data-job-title');
                        
                        modalTitle.textContent = `For: ${jobTitle}`;
                        modalList.innerHTML = '';
                        
                        const apps = await window.localHireAPI.getApplicationsForJob(jobId);
                        if (!apps || apps.length === 0) {
                            modalList.innerHTML = `<p class="text-muted" style="text-align: center; padding: 2rem;">No quotes received yet.</p>`;
                        } else {
                            apps.forEach(app => {
                                modalList.innerHTML += `
                                    <div class="glass-card" style="padding: 1.5rem; background: var(--surface-light); border: 1px solid var(--border-light);">
                                        <div class="flex justify-between items-start" style="margin-bottom: 1rem;">
                                            <div class="flex items-center gap-3">
                                                <img src="${app.workerAvatar || ''}" style="width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--primary);">
                                                <div>
                                                    <h4 style="margin: 0; font-size: 1.1rem; color: var(--text-main);">${app.workerName || 'Worker'}</h4>
                                                    <a href="profile.html?id=${app.workerId}" style="font-size: 0.8rem; color: var(--primary); text-decoration: none;">View Profile</a>
                                                </div>
                                            </div>
                                            <div class="flex flex-col items-end">
                                                <span style="font-size: 1.2rem; font-weight: bold; color: var(--secondary);">${app.quote}</span>
                                                <span class="badge" style="margin-top: 0.25rem;">${app.status || 'Pending'}</span>
                                            </div>
                                        </div>
                                        <p style="font-size: 0.95rem; margin: 0; color: var(--text-main); padding: 1rem; background: rgba(0,0,0,0.05); border-radius: 8px;">"${app.message}"</p>
                                        <div style="margin-top: 1rem; text-align: right;">
                                            <button class="btn btn-primary accept-quote-btn" data-app-id="${app.id}" data-job-id="${jobId}" style="padding: 0.5rem 1.25rem; font-size: 0.85rem;">
                                                Accept Quote & Hire
                                            </button>
                                        </div>
                                    </div>
                                `;
                            });
                        }
                        
                        modal.style.display = 'flex';
                    }
                });

                modalList.addEventListener('click', (e) => {
                    const acceptBtn = e.target.closest('.accept-quote-btn');
                    if (acceptBtn) {
                        const jobId = acceptBtn.getAttribute('data-job-id');
                        const appId = acceptBtn.getAttribute('data-app-id');
                        const apps = window.localHireApp.getApplications();
                        const app = apps.find(a => a.id === appId);
                        const workerId = app ? app.workerId : 'w1';
                        const amountStr = app ? app.quote.replace(/[^0-9]/g, '') : '500';
                        const amount = parseFloat(amountStr) || 500;

                        modal.style.display = 'none';
                        if (window.LocalHireEscrow && window.LocalHireEscrow.openFundModal) {
                            window.LocalHireEscrow.openFundModal(jobId, workerId, amount, () => {
                                alert('✅ Quote accepted & payment locked in Escrow!');
                                window.location.reload();
                            });
                        } else {
                            const jobs = window.localHireApp.getJobs();
                            const targetJob = jobs.find(j => j.id === jobId);
                            if (targetJob) {
                                targetJob.status = 'In Progress';
                                localStorage.setItem('localHire_jobs', JSON.stringify(jobs));
                                alert('Quote accepted! Job status has been updated to In Progress.');
                                window.location.reload();
                            }
                        }
                    }
                });

                closeBtn.addEventListener('click', () => {
                    modal.style.display = 'none';
                });
            }

            // Load Applications (if Worker)
            if (user.role === 'Worker') {
                (async () => {
                    const viewAppsContainer = document.getElementById('apps-container');
                    const noApps = document.getElementById('no-apps');
                    
                    const myApps = await window.localHireAPI.getWorkerApplications();
                    if (!myApps || myApps.length === 0) {
                        viewAppsContainer.style.display = 'none';
                        noApps.style.display = 'block';
                    } else {
                        viewAppsContainer.style.display = 'grid';
                        noApps.style.display = 'none';
                        viewAppsContainer.innerHTML = '';
                        
                        const allJobs = window.localHireApp.getJobs();
                        
                        myApps.forEach(app => {
                            const job = allJobs.find(j => j.id === app.jobId);
                            if (job) {
                                viewAppsContainer.innerHTML += `
                                    <div class="glass-card flex-col gap-3">
                                        <div class="flex justify-between items-start">
                                            <h4 style="margin: 0; color: var(--primary);">${job.title}</h4>
                                            <span class="badge badge-primary">${app.status || 'Pending'}</span>
                                        </div>
                                        <p class="text-muted" style="margin: 0; font-size: 0.9rem;">To: ${job.customerName}</p>
                                        <div style="margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--border-light);">
                                            <p style="margin: 0 0 0.5rem 0; font-size: 0.85rem; color: var(--text-muted);">Your Quote</p>
                                            <p style="margin: 0; font-weight: bold; color: var(--secondary); font-size: 1.1rem;">${app.quote}</p>
                                        </div>
                                    </div>
                                `;
                            }
                        });
                    }
                })();
            }
        });
    </script>
</body>
</html>
